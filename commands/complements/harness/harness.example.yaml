harness_version: 1

# O instalador substitui o marcador de raiz do plugin pelo caminho absoluto
# ao gerar workspace/harness.yaml.
workspace: "{{PLUGIN_ROOT}}/workspace"

# Packs de capacidade (o mapeamento é sempre habilitado).
plugins:
  exec: {enabled: true}
  patch: {enabled: true}
  validate: {enabled: true}
  state: {enabled: true}
  watch: {enabled: true}
  clean: {enabled: true}

# Uma release de compatibilidade: `/harness run <task>` encaminha para o pack dono.
compat:
  forward_legacy: true

legacy:
  # Perfil de stack: php-mysql (padrão), java-oracle, dotnet-sqlserver,
  # ruby-postgres, node-postgres ou custom (com overrides abaixo).
  stack: php-mysql
  # Encoding dos fontes. Legado Windows costuma ser cp1252/latin-1.
  # Também é o encoding de caracteres novos em patch:apply.
  encoding: utf-8
  # Globs excluídos de code:skeleton e db:links (diretório, caminho ou nome).
  # exclude: ["relatorios", "*_old.php", "*_bkp.php", "*.bak.php"]
  # Overrides opcionais sobre o perfil:
  # extensions: [".php", ".phtml"]
  # sql_extensions: [".php"]
  # languages: { ".phtml": "php" }
  # db_dialect: mysql
  # Fixture de referência do harness (RotaCar), versionada junto do plugin.
  repo_path: "{{PLUGIN_ROOT}}/fixture/exemplo-locadora"
  app_container: rotacar_php
  db_container: rotacar_mysql
  db_name: rotacar
  db_user_env: HARNESS_DB_USER
  db_password_env: HARNESS_DB_PASSWORD
  manuals_path: "{{PLUGIN_ROOT}}/fixture/exemplo-locadora/manuais"
  tickets_path: "{{PLUGIN_ROOT}}/fixture/exemplo-locadora/tickets"
  schema_dump: "{{PLUGIN_ROOT}}/fixture/exemplo-locadora/banco/dump-estrutura.sql"

tools:
  # Venv do próprio plugin (deps do harness).
  python: "{{PLUGIN_ROOT}}/.venv/Scripts/python.exe"
  # ripgrep usado por code:search/code:symbol (padrão: `rg` do PATH).
  rg: rg
  # RAG opcional (camada semântica: manuais, tickets, schema/vínculos).
  # Só preencha depois de `harness install --with-rag`.
  # rag:
  #   path: "{{PLUGIN_ROOT}}/vendor/local-rag-system"
  #   python: "{{PLUGIN_ROOT}}/vendor/local-rag-system/.venv/Scripts/python.exe"
  #   api: http://127.0.0.1:8000

output:
  default_sinks: [stdout, clipboard]
  max_chars:
    clipboard: 12000
  max_blocks_per_message: 5
  max_loop_iterations: 3
  # Limite de saltos (busca -> leitura -> símbolo) por pergunta.
  max_hops: 6
  # `ask`: contextos padrão e orçamento em tokens (estimativa: caracteres / token_chars).
  # Prioridade no corte: pergunta > map > skeleton > db > code > docs > rag.
  ask_context: "map,db"
  # ask_budget: 6000
  # token_chars: 4

# Esqueleto: limite de símbolos por arquivo no SKELETON.md e janela do ranking (git log).
# skeleton:
#   max_symbols: 12
#   recent_days: 180
#   exclude: ["relatorios"]   # equivale a legacy.exclude
#   # MAP.md completo em várias partes (todas as linhas, não só as 5 por diretório).
#   # Gera map/part-NNN.md + MAP.md como índice quando passa de map_part_chars.
#   map_split: true
#   map_part_chars: 24000

# Store SQLite (M1): arquivos, símbolos, imports, operações SQL e FKs.
# graph:
#   path: "{{PLUGIN_ROOT}}/workspace/knowledge/graph.sqlite"
#   parser_version: 3

# Brief ancorado (M2): budget em tokens e caps do pacote.
# brief:
#   default_budget: 6000
#   max_budget: 12000
#   max_paths: 15
#   max_tables: 10

# Monitores (watch:downloads) e estado de tarefa.
# watch:
#   downloads_path: "C:/Users/voce/Downloads"
#   patch_branch: ajuste-chat

# Estado de tarefa (retomada em outra conversa).
# Sem este campo: workspace/state/
# state:
#   path: "D:/harness/state"

hooks:
  tasks: ["code:skeleton"]
  log: runs/hooks.log

policy:
  auto_approve: [read]
  confirm: [write]
  llm_response_blocks: confirm_all
  deny_patterns:
    - '(?i)\brm\s+-rf\s+/'
    - '(?i)Remove-Item\b.*-Recurse.*\b(C:\\|\\\\)'
    - '(?i)\bgit\s+push\b.*--force'
  # Blocos colados do chat não executam estas tarefas (padrão abaixo).
  # llm_denied_tasks: [shell:run, py:run, docker:exec]
  # llm_allowed_tasks: [code:read, code:search]   # se definido, só estas
  redact:
    enabled: true
    patterns: [cpf, cnpj, email, telefone]
    # Colunas mascaradas em db:query (globs tabela.coluna; sem ponto = qualquer tabela).
    columns: ["cpf", "cnpj", "email", "*.senha", "*.telefone"]
    # Nomes extras tratados como segredo, além de senha/token/api_key...
    secrets: []
    apply_to: [exec, ask, "context:pack"]
    keep_raw_log: false
  allowed_roots:
    - "{{PLUGIN_ROOT}}/fixture/exemplo-locadora"
    - "{{PLUGIN_ROOT}}/workspace"

patch:
  protected_branches: [main, master, develop, production, producao]
  allow_dirty: false
  new_file_eol: auto   # auto (vizinhos) | lf | crlf

pipelines:
  verify:
    - docker:exec: { container: rotacar_php, command: "php -l $(git diff --name-only)" }
    - docker:exec: { container: rotacar_php, command: "vendor/bin/phpunit --colors=never" }
  test:run:
    - docker:exec: { container: rotacar_php, command: "vendor/bin/phpunit --colors=never {filter}" }
